services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-aegisrag}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD:-aegis_dev_only}@db:5432/${POSTGRES_DB:-aegisrag}
      FILE_STORAGE_DIR: /data/files
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      DEMO_MODE: ${DEMO_MODE:-true}
      SEED_ON_START: ${SEED_ON_START:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-change-me-demo}
      AI_PROVIDER: ${AI_PROVIDER:-local}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-}
      AI_EMBED_MODEL: ${AI_EMBED_MODEL:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - filedata:/data/files
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  filedata:
